{% extends 'portal/base.html' %}{% block title %}Administração · LABTEC.IN{% endblock %}{% block content %}<section x-data="{open: true}"><h1>Dashboard administrativo</h1><p>Olá, {{ request.user.get_username }}. <a href="{% url 'admin:index' %}">Abrir Django Admin</a> · <a href="{% url 'staff-logout' %}">Sair</a></p><form hx-get="{% url 'admin-dashboard' %}" hx-target="#dashboard-counts" hx-swap="innerHTML"><label>Unidade <select name="unit"><option value="">Todas</option>{% for unit in units %}<option value="{{ unit.slug }}"{% if selected_unit == unit.slug %} selected{% endif %}>{{ unit.name }}</option>{% endfor %}</select></label><button>Filtrar</button></form><div id="dashboard-counts">{% include 'portal/partials/admin_dashboard_counts.html' %}</div></section>{% endblock %}
