{% extends 'portal/base.html' %}
{% block title %}Busca · LABTEC.IN{% endblock %}
{% block content %}
<section class="page-section">
  <div class="container form-shell">
    <div class="section-heading">
      <p class="section-kicker">Encontre no portal</p>
      <h1 class="section-title">Busca global</h1>
      <p class="section-lead">Pesquise projetos, pessoas, notícias, pesquisas, cursos e documentos publicados.</p>
    </div>
    <form class="form-card" method="get" action="{% url 'search' %}" hx-get="{% url 'search' %}" hx-target="#search-results" hx-push-url="true">
      <div class="form-field">
        <label for="global-q">Termo de busca</label>
        <input id="global-q" name="q" value="{{ query }}" required placeholder="Ex.: biodiversidade, Farma Amazônia...">
      </div>
      <button class="btn btn-primary" type="submit">Buscar</button>
    </form>
    <div id="search-results" class="card-grid admin-preview" aria-live="polite">
      {% include 'portal/partials/search_results.html' %}
    </div>
  </div>
</section>
{% endblock %}
