{% extends 'portal/base.html' %}
{% block title %}Busca · LABTEC.IN{% endblock %}
{% block content %}
<section class="page-section">
  <div class="container form-shell">
    <div class="section-heading">
      <p class="section-kicker">Encontre no portal</p>
      <h1 class="section-title">Busca global</h1>
      <p class="section-lead">Pesquise projetos, pessoas, notícias, pesquisas, cursos e documentos publicados.</p>
    </div>
    <form class="form-card" hx-get="/api/v1/search/" hx-target="#search-results" hx-swap="none">
      <div class="form-field">
        <label for="global-q">Termo de busca</label>
        <input id="global-q" name="q" required placeholder="Ex.: biodiversidade, Farma Amazônia...">
      </div>
      <button class="btn btn-primary" type="submit">Buscar</button>
    </form>
    <div id="search-results" class="card-grid admin-preview" aria-live="polite">
      <p class="empty-state">Digite um termo para pesquisar.</p>
    </div>
  </div>
</section>
<script>
document.body.addEventListener('htmx:afterRequest', function (event) {
  if (event.detail.elt.closest('form')?.getAttribute('hx-get')?.endsWith('/search/')) {
    const target = document.querySelector('#search-results');
    try {
      const data = JSON.parse(event.detail.xhr.responseText);
      target.innerHTML = data.results.length ? data.results.map(item => `<article class="card"><p class="section-kicker">${item.type}</p><h3><a href="${item.url}">${item.title}</a></h3><p>${item.summary || ''}</p></article>`).join('') : '<p class="empty-state">Nenhum resultado encontrado.</p>';
    } catch (_) {
      target.innerHTML = '<p class="empty-state">Não foi possível realizar a busca.</p>';
    }
  }
});
</script>
{% endblock %}
