{% extends 'portal/base.html' %}
{% block title %}Entrar · LABTEC.IN{% endblock %}
{% block content %}
<section class="page-section compact">
  <div class="container form-shell login-shell">
    <div class="section-heading">
      <p class="section-kicker">Acesso administrativo</p>
      <h1 class="section-title">Entrar</h1>
      <p class="section-lead">Acesse o painel editorial do portal do LABTEC.IN e LATEC.</p>
    </div>
    <form class="form-card login-form" method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-field">
          <label for="login-username">Usuário <span class="required">*</span></label>
          <input id="login-username" name="username" required autofocus>
        </div>
        <div class="form-field">
          <label for="login-password">Senha <span class="required">*</span></label>
          <input id="login-password" type="password" name="password" required>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Entrar</button>
      {% if error %}<p class="error" role="alert" style="margin-top:12px;">{{ error }}</p>{% endif %}
    </form>
  </div>
</section>
{% endblock %}
